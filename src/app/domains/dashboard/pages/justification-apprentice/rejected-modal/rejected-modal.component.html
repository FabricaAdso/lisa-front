<nz-modal
  [(nzVisible)]="isVisible"
  nzTitle="Justificación Rechazada"
  (nzOnCancel)="handleCancel()"
  [nzFooter]="null"
>
<ng-container *nzModalContent>
  <div>
   <!-- Enlace al archivo cargado (solo se muestra si hay archivo cargado) -->
   <div *ngIf="justification.file_url" style="margin-top: 8px; display: flex; align-items: center;">
    <a
      [href]="justification.file_url"
      target="_blank"
      style="text-decoration: none; color: inherit; display: flex; align-items: center;"
    >
      <i nz-icon nzType="file-pdf" nzTheme="outline" style="color: #d32f2f; margin-right: 8px;"></i>
      <span>{{ 'Archivo cargado' }}</span>
    </a>
  </div>

    <!-- Razón de rechazo del profe -->
    <p style="color: #333; margin-bottom: 16px;">
      {{ justification.aprobation?.motive}}
    </p>

    <!-- Botón de cerrar -->
    <div style="text-align: right;">
      <button nz-button nzType="default" (click)="handleCancel()">Cerrar</button>
    </div>
  </div>
</ng-container>
</nz-modal>
