<nz-modal [(nzVisible)]="isVisible" [nzTitle]="modalTitle" (nzOnCancel)="handleCancel()" [nzFooter]="null">
  <ng-container *nzModalContent>
    <div class="content">

      <!-- Carga de archivo -->
      <div>
        <div *ngIf="!justification.file_url">


          <label for="file-upload" style="display: flex; align-items: center; cursor: pointer;">
            <i nz-icon nzType="upload" style="margin-right: 8px;"></i>
            <span>Seleccionar Archivo</span>
          </label>
          <input id="file-upload" type="file" accept=".pdf" (change)="handleFileInput($event)" style="display: none;" />
          <!-- previsualizador -->
          <div *ngIf="file_url" style="margin-top: 8px; display: flex; align-items: center;">
            <i nz-icon nzType="file-pdf" nzTheme="outline" style="color: #d32f2f; margin-right: 8px;"></i>

            <span>Archivo seleccionado: {{ file.name }}</span>
          </div>
        </div>

        <!-- Enlace al archivo cargado (solo se muestra si hay archivo cargado) -->
        <div *ngIf="justification.file_url" class="file-container">
          <a class="file-link" [href]="justification.file_url" target="_blank">
            <i nz-icon nzType="file-pdf" nzTheme="outline"></i>
            <span>Ver archivo adjunto</span>
          </a>
        </div>

      </div>

      <!-- Mensaje de error -->
      <p *ngIf="errorMessage" style="color: red; margin-top: 8px;">{{ errorMessage }}</p>

      <!-- Mostrar descripción (modo visualización) -->
      <div *ngIf="justification?.file_url" >
        <label for="justificacion">Justificación</label>

        <div *ngIf="justification?.description; else noDescription"
          style="width: 100%; margin-top: 8px; padding: 8px; border: 1px solid #eeeeee; border-radius: 4px; background-color: #fbfbfb;">
          {{ justification.description }}
        </div>

        <ng-template #noDescription>
          <div
            style="width: 100%; margin-top: 8px; padding: 8px; border: 1px solid #eeeeeeee; border-radius: 4px; background-color: #fbfbfb; color: #888;">
            No se ha proporcionado descripción.
          </div>
        </ng-template>
      </div>

      <!-- Mostrar textarea (modo carga) -->
      <div *ngIf="!justification?.file_url">
        <label for="justificacion">Justificación</label>
        <textarea id="justificacion" nz-input rows="4" placeholder="Escriba su descripción aquí..."
          [(ngModel)]="description" style="width: 100%; margin-top: 8px;">
  </textarea>
      </div>


      <!-- Botones -->
      <div style="margin-top: 16px; text-align: right;">
        <button nz-button nzType="default" (click)="handleCancel()">Cancelar</button>


        <button nz-button nzType="primary" [disabled]="!file || isLoading" (click)="handleSubmit()">
          <i *ngIf="isLoading" nz-icon nzType="loading" nzTheme="outline"></i> Enviar
        </button>
      </div>
    </div>
  </ng-container>
</nz-modal>
