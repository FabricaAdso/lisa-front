<div class="desktop:h-[80vh] desktop:flex justify-center">
  <full-calendar
    [options]="calendarOptions"
    class="calendar-container"
  ></full-calendar>
</div>

<nz-modal
  [(nzVisible)]="isVisible"
  nzTitle="Detalles de la sesión"
  (nzOnOk)="handleOk()"
  (nzOnCancel)="handleCancel()"
  [nzFooter]="modalFooter"
  [nzClosable]="true"
>
  <ng-container *nzModalContent>
    <p style="display: flex; justify-content:center">
      <b>{{ selectedEvent?.title }}</b>
    </p>
    <nz-timeline style="
    padding-left: 12px;
    margin-top: 5px; ">
      <nz-timeline-item 
        *ngFor="let session of selectedEvent?.sessions"
        [nzColor]="getTimelineColor(session)"
      >
      <span>
       
        Ficha: {{ session.course_code }} - {{ session.program_name }}
      </span>

      <br>

      <span>
        Hora: {{ formatTimeWithoutSeconds(session.start_time) || "Sin Asignar" }} -
        {{ formatTimeWithoutSeconds(session.end_time) || "Sin Asignar" }} -
        Ambiente: {{ session.environment }}

      </span>
        <br>
        
      </nz-timeline-item>
    </nz-timeline>
  </ng-container>
  <ng-template #modalFooter>
    <button nz-button nzType="primary" (click)="handleOk()">Aceptar</button>
  </ng-template>
</nz-modal>
