<nz-modal [(nzVisible)]="isVisible" nzTitle="Justificación Rechazada" (nzOnCancel)="handleCancel()" [nzFooter]="null">
  <ng-container *nzModalContent>
    <div>
        <!-- Enlace al archivo cargado (solo se muestra si hay archivo cargado) -->
      <div *ngIf="justification.file_url" >
        <a [href]="justification.file_url" target="_blank"
         >
          <i nz-icon nzType="file-pdf" nzTheme="outline" style="color: #d32f2f; margin-right: 8px;"></i>
          <span>{{ 'Archivo cargado' }}</span>
        </a>
      </div>

      <p style="color: #333; margin-bottom: 16px">
        {{ justification.aprobation?.motive}}
      </p>
    </div>
  </ng-container>
</nz-modal>
