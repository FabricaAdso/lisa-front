<div class="flex flex-row justify-end gap-2 w-full">
<div class="flex my-4 w-64">
  <nz-select class="w-full" [(ngModel)]="selectedProgramId" (ngModelChange)="onProgramFilterChange($event)" nzShowSearch="true" nzPlaceHolder="Buqueda por ficha">
    @for (item of programs; track $index) {
    <nz-option
      [nzValue]="item.id"
      [nzLabel]="item.name"
    ></nz-option>
    }
  </nz-select>
</div>
<div class="flex my-4 w-64">
      <nz-select class="w-full" [(ngModel)]="selectedProgramId" (ngModelChange)="onProgramFilterChange($event)"  nzShowSearch="true" nzPlaceHolder="Filtrar por programa">
        @for (item of programs; track $index) {
        <nz-option
          [nzValue]="item.id"
          [nzLabel]="item.name"
        ></nz-option>
        }
      </nz-select>
</div>
</div>
<nz-table #basicTable [nzData]="courses_model" [nzBordered]="false" [nzFrontPagination]="false" >
    <thead>
      <tr>
        <th class="p-2">Codigo</th>
        <th class="p-2">Nombre del programa</th>
        <th class="p-2">Intructor lider</th>
        <th class="p-2">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (data of courses_model; track $index) {
      <tr>
        <td class="p-2">{{ data.code }}</td>
        <td class="p-2">{{ data.program?.name }}</td>
        <td class="p-2"></td>

      </tr>
      }
    </tbody>
  </nz-table>
  <div class="flex justify-end">
    <nz-pagination
    [nzTotal]="totalItems"
    (nzPageIndexChange)="changePage($event)">
  </nz-pagination>
  </div>
