<section class="Environments">
  <div class="content-tittle">
    <div class="search-box">
      <nz-select [(ngModel)]="selectedUser" (nzScrollToBottom)="loadMore()" nzPlaceHolder="Seleccione una sede" nzAllowClear
        [nzDropdownRender]="renderTemplate">
        @for (item of optionList; track item) {
        <nz-option [nzValue]="item" [nzLabel]="item"></nz-option>
        }
      </nz-select>
      <ng-template #renderTemplate>
        @if (isLoading) {
          <nz-spin></nz-spin>
        }
      </ng-template>
    </div>
    <div class="botons">
      <button>edit</button>
      <button>delete</button>
      <button>agregar sede</button>
    </div>

  </div>

  <nz-table #basicTable [nzData]="listOfData">
    <thead>
      <tr>
        <th>Name</th>
        <th>Capacity</th>
        <th>Area</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (data of basicTable.data; track data) {
      <tr>
        <td>{{ data.name }}</td>
        <td>{{ data.age }}</td>
        <td>{{ data.address }}</td>
        <td>
          <a>Action 一 {{ data.name }}</a>
          <nz-divider nzType="vertical"></nz-divider>
          <a>Delete</a>
        </td>
      </tr>
      }
    </tbody>
  </nz-table>




</section>
