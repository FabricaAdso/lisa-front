<nz-modal 
[(nzVisible)]="isVisible" 
nzTitle="Actualizar Contraseña" 
(nzOnCancel)="closeModal.emit()" 
>



<ng-container *nzModalContent>
    <form [formGroup]="passwordForm">
      <!-- Contraseña actual -->

 
      <div class="password-input-container">
        <label>Contraseña actual:</label>
        <input 
          nz-input 
          [type]="isCurrentPasswordVisible ? 'text' : 'password'" 
          formControlName="currentPassword"
        />
        <i 
          nz-icon 
          [nzType]="isCurrentPasswordVisible ? 'eye-invisible' : 'eye'" 
          (click)="togglePasswordVisibility('currentPassword')" 
          class="password-icon">
        </i>
      
        <!-- Solo muestra el mensaje si el usuario tocó el campo o intentó enviarlo -->
        <div 
          *ngIf="(passwordForm.get('currentPassword')?.hasError('required') && 
                  (passwordForm.get('currentPassword')?.touched || submitted))" 
          class="error-message">
          La contraseña actual es obligatoria.
        </div>
      
        <div 
          *ngIf="passwordForm.get('currentPassword')?.hasError('incorrect')" 
          class="error-message">
          Contraseña actual incorrecta.
        </div>
      </div>
      
  
      <!-- Nueva contraseña -->
      <div class="password-input-container">
        <label>Nueva contraseña:</label>
        <input nz-input [type]="isNewPasswordVisible ? 'text' : 'password'" formControlName="newPassword" />
        <i nz-icon [nzType]="isNewPasswordVisible ? 'eye-invisible' : 'eye'" 
           (click)="togglePasswordVisibility('newPassword')" class="password-icon"></i>
        <div *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched" class="error-message">
          <span *ngIf="passwordForm.get('newPassword')?.errors?.['required']">La nueva contraseña es obligatoria.</span>
          <span *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']">Debe tener al menos 8 caracteres.</span>
          <span *ngIf="passwordForm.get('newPassword')?.errors?.['pattern']">Debe contener letras, números y símbolos.</span>
        </div>
      </div>
  
      <!-- Confirmar contraseña -->
      <div class="password-input-container">
        <label>Confirmar contraseña:</label>
        <input nz-input [type]="isConfirmPasswordVisible ? 'text' : 'password'" formControlName="confirmPassword" />
        <i nz-icon [nzType]="isConfirmPasswordVisible ? 'eye-invisible' : 'eye'" 
           (click)="togglePasswordVisibility('confirmPassword')" class="password-icon"></i>
        <div *ngIf="passwordForm.get('confirmPassword')?.invalid && passwordForm.get('confirmPassword')?.touched" class="error-message">
          <span *ngIf="passwordForm.get('confirmPassword')?.errors?.['required']">Debe confirmar la nueva contraseña.</span>
        </div>
        <div *ngIf="passwordForm.errors?.['notMatching'] && passwordForm.get('confirmPassword')?.touched" class="error-message">
          Las contraseñas no coinciden.
        </div>
      </div>
    </form>
  </ng-container>
  




    <ng-container *nzModalFooter>
        <button nz-button (click)="closeModal.emit()">Cancelar</button>
        <button nz-button nzType="primary" (click)="handleOk()">Aceptar</button>
      </ng-container>


</nz-modal>
