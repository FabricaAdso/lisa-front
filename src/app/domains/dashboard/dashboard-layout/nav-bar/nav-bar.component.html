<nav class="flex justify-between items-center bg-[#ffffff] px-[24px] h-[64px] border-[0.5px] border-b-[#38a901]">
  <!-- Logo -->
  <picture class="w-[55px] h-[55px]">
    <img [src]="Image_logo" alt="Logo de la aplicación" class="h-full w-full" />
  </picture>


  <!-- Sección del usuario -->
  <div class="flex gap-1 items-center space-x-2">




    <ng-container *ngIf="isLoggedIn">
      <!-- Nombre completo del usuario, solo con clic -->
      <div class="relative">
        <span class="hidden desktop:inline text-black font-normal text-xl mr-2 cursor-pointer dropdown-button1"
          (click)="toggleDropdown1()">
          {{ user()?.name }} {{ user()?.last_name }}
        </span>

        <!-- Menú desplegable -->
        <div *ngIf="isDropdownOpen1"
          class="absolute right-[-28px] top-full mt-6 w-60 rounded bg-transparent dropdown-menu1 z-50">

          <button (click)="openChangePasswordModal()"
            class="flex items-center justify-start w-full text-lg text-black hover:bg-gray-100 bg-white py-3 px-4 rounded-lg border whitespace-nowrap text-left">

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="h-6 w-[1.4rem] flex-shrink-0 mr-2 -ml-0.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>

            <span class="flex items-center">Actualizar contraseña</span>

          </button>



          <button (click)="logout()"
            class="flex items-center justify-start w-full text-lg text-black hover:bg-gray-100 bg-white py-3 px-4 rounded-lg border desktop:block whitespace-nowrap text-left">
            <span nz-icon nzType="logout" nzTheme="outline" class="mr-2 text-lg leading-none flex-shrink-0"></span>
            Cerrar sesión
          </button>
        </div>
      </div>
    </ng-container>






    <div class="flex">
      <button (click)="goNotifications()">
        <nz-badge [nzCount]="notificationCount()">
          <span class="text-2xl" nz-icon nzType="bell">
          </span>
        </nz-badge>
      </button>
    </div>

    <ng-container *ngIf="!isLoggedIn">
      <button nz-button nzType="primary"
        class="bg-[#38a901] hover:bg-white hover:text-[#38a901] hover:border hover:border-[#38a901] h-10 w-28 rounded-lg text-base text-white"
        (click)="login()">
        Iniciar sesión
      </button>
    </ng-container>


    <!-- Icono de opciones para pantallas mobile y tablet -->
    <div class="relative" *ngIf="isLoggedIn">
      <button class="flex items-center text-lg mr-2 mobile:block tablet:block desktop:hidden dropdown-button2"
        (click)="toggleDropdown2()">
        <span nz-icon nzType="bars" nzTheme="outline" class="text-4xl text-[#38a901]"></span>
      </button>
      <!-- Menú desplegable -->
      <app-drop-down-menu *ngIf="isDropdownOpen2"
        class="app-drop-down-menu absolute right-0 mt-[1rem] w-48 bg-black rounded shadow-lg z-10 mobile:block tablet:block desktop:hidden"></app-drop-down-menu>
    </div>
  </div>
</nav>


<app-change-password-modal *ngIf="isChangePasswordModalVisible" [isVisible]="isChangePasswordModalVisible"
  (closeModal)="closeChangePasswordModal()" (passwordChanged)="onPasswordChanged($event)">
</app-change-password-modal>
